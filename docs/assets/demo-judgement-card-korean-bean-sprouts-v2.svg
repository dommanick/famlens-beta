<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .headline { font-size: 64px; font-weight: 850; fill: #123524; }
      .subhead { font-size: 34px; font-weight: 700; fill: #334155; }
      .label { font-size: 28px; font-weight: 800; fill: #ffffff; }
      .card-title { font-size: 34px; font-weight: 850; fill: #0f172a; }
      .card-text { font-size: 34px; font-weight: 700; fill: #1f2937; }
      .small { font-size: 26px; font-weight: 650; fill: #64748b; }
      .footer { font-size: 30px; font-weight: 750; fill: #334155; }
    </style>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="#eef2f7"/>
  <rect x="42" y="36" width="816" height="1128" rx="42" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Hero/product visual area -->
  <rect x="74" y="68" width="752" height="430" rx="34" fill="url(#heroBg)"/>
  <rect x="110" y="102" width="154" height="62" rx="31" fill="#16a34a"/>
  <text x="187" y="144" text-anchor="middle" class="font label">可以买</text>

  <text x="110" y="232" class="font headline">韩国黄豆芽</text>
  <text x="112" y="286" class="font subhead">清淡配菜，适合家常做</text>

  <!-- Bowl -->
  <ellipse cx="598" cy="358" rx="188" ry="72" fill="#cbd5e1"/>
  <path d="M420 350 C434 466 760 466 776 350 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="5"/>
  <ellipse cx="598" cy="350" rx="180" ry="62" fill="#ffffff" stroke="#94a3b8" stroke-width="5"/>
  <ellipse cx="598" cy="350" rx="142" ry="44" fill="#dcfce7"/>

  <!-- Bean sprouts illustration -->
  <g stroke-linecap="round" stroke-width="9">
    <path d="M495 356 C515 312 532 292 558 262" stroke="#f7d36b" fill="none"/>
    <path d="M545 368 C555 320 585 290 622 260" stroke="#f7d36b" fill="none"/>
    <path d="M600 370 C605 322 640 288 690 266" stroke="#f7d36b" fill="none"/>
    <path d="M660 362 C650 324 674 300 724 286" stroke="#f7d36b" fill="none"/>
    <path d="M468 380 C510 360 560 356 610 382" stroke="#f7d36b" fill="none"/>
    <path d="M535 392 C586 366 648 364 722 390" stroke="#f7d36b" fill="none"/>
  </g>
  <g fill="#facc15" stroke="#ca8a04" stroke-width="3">
    <ellipse cx="558" cy="262" rx="23" ry="15" transform="rotate(-18 558 262)"/>
    <ellipse cx="622" cy="260" rx="24" ry="16" transform="rotate(-22 622 260)"/>
    <ellipse cx="690" cy="266" rx="24" ry="16" transform="rotate(-10 690 266)"/>
    <ellipse cx="724" cy="286" rx="22" ry="15" transform="rotate(-8 724 286)"/>
  </g>
  <g fill="#22c55e">
    <path d="M514 320 C488 302 468 304 452 324 C478 334 498 334 514 320Z"/>
    <path d="M642 315 C664 292 690 292 710 310 C686 330 664 332 642 315Z"/>
  </g>

  <!-- Three visual judgement blocks -->
  <rect x="74" y="530" width="752" height="174" rx="28" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="152" cy="617" r="45" fill="#dbeafe"/>
  <!-- Pot icon -->
  <path d="M124 622 H180 L172 654 H132 Z" fill="#2563eb"/>
  <path d="M132 608 H172" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <path d="M136 594 C126 578 145 570 136 554" stroke="#60a5fa" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M160 594 C150 578 169 570 160 554" stroke="#60a5fa" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="222" y="596" class="font card-title">怎么吃</text>
  <text x="222" y="650" class="font card-text">焯水凉拌，或煮汤</text>

  <rect x="74" y="732" width="752" height="174" rx="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="152" cy="819" r="45" fill="#dcfce7"/>
  <!-- Nutrition leaf icon -->
  <path d="M122 824 C128 776 178 768 190 788 C176 836 136 846 122 824Z" fill="#16a34a"/>
  <path d="M132 828 C150 808 166 796 186 788" stroke="#bbf7d0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="222" y="798" class="font card-title">吃了有什么好</text>
  <text x="222" y="852" class="font card-text">有一点蛋白和纤维</text>

  <rect x="74" y="934" width="752" height="174" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <circle cx="152" cy="1021" r="45" fill="#ffedd5"/>
  <!-- Warning icon -->
  <path d="M152 976 L196 1052 H108 Z" fill="#f97316"/>
  <rect x="148" y="1005" width="8" height="27" rx="4" fill="#fff7ed"/>
  <circle cx="152" cy="1042" r="5" fill="#fff7ed"/>
  <text x="222" y="1000" class="font card-title">注意</text>
  <text x="222" y="1054" class="font card-text">洗干净，最好煮熟吃</text>

  <!-- Footer storage hint -->
  <rect x="128" y="1128" width="644" height="54" rx="27" fill="#eef2ff"/>
  <text x="450" y="1165" text-anchor="middle" class="font footer">放冰箱，尽量 2-3 天吃完</text>
</svg>
