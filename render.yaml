services:
  - type: web
    name: famlens
    env: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: famlens-data
      mountPath: /var/data/famlens
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: FamLens
      - key: AI_MODEL
        value: gpt-4.1-mini
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: coral
      - key: REQUEST_TIMEOUT_SECONDS
        value: 30
      - key: PROFILE_STORE_PATH
        value: /var/data/famlens/profiles.json
      - key: FAMILY_RECORD_STORE_PATH
        value: /var/data/famlens/family_records.json
      - key: EVENT_LOG_PATH
        value: /var/data/famlens/events.jsonl
      - key: CARD_OUTPUT_DIR
        value: /var/data/famlens/cards
      - key: UPLOAD_OUTPUT_DIR
        value: /var/data/famlens/uploads
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
